# caching path
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cache:10m inactive=60m max_size=5g;

# Swarm's default VIP load balancing for urlToHtml is blind connection-level round
# robin — zero visibility into each replica's in-process render queue, so a replica
# already backed up keeps getting new connections at the same rate as an idle one.
# tasks.urlToHtml resolves to the individual replica IPs (works under the default
# VIP endpoint mode, no dnsrr change needed on the service itself); nginx expands a
# hostname that resolves to multiple A records into one peer per IP at config
# load/reload time. least_conn then routes by actual active-connection count per
# replica, which tracks backlog (nginx holds the connection open for the whole time
# a request is queued or rendering) far better than Swarm's round robin does.
#
# zone is required for least_conn's counters to be shared across nginx worker
# processes — without it each worker tracks its own connection counts independently,
# which is a much weaker guarantee than "least connections across the whole instance".
#
# max_fails=0 is deliberate: renderer.js already signals overload via HTTP 503 (see
# MAX_QUEUE_WAIT_MS in inflightRequests.js), and that 503 is in proxy_next_upstream
# below — nginx has no way to "retry on 503" without also counting it toward
# max_fails on the same server line. A busy-but-healthy replica hitting a few 503s
# in quick succession must not get marked down and excluded from rotation entirely;
# that would concentrate load onto the remaining replicas, the opposite of the goal.
# least_conn + proxy_next_upstream's retry already route around a busy replica
# without needing to eject it.
upstream urlToHtml_replicas {
    zone urltohtml_zone 64k;
    least_conn;
    keepalive 32;
    server tasks.urlToHtml:7100 max_fails=0;
}

# Only re-resolves tasks.urlToHtml at reload — see the periodic `nginx -s reload`
# loop in stack/docker-compose.yml's nginx service command, which keeps this fresh
# as Swarm replaces/restarts/scales urlToHtml replicas.
log_format upstream_debug '$remote_addr - [$time_local] "$request" $status '
                           '$body_bytes_sent upstream=$upstream_addr '
                           'upstream_time=$upstream_response_time cache=$upstream_cache_status';

server {
    listen 80;
    server_name prerender.infra.cbd.int;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name prerender.infra.cbd.int;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/prerender.infra.cbd.int/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prerender.infra.cbd.int/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Includes which urlToHtml replica actually served each request — the concrete
    # way to verify requests are spreading across replicas instead of piling on one.
    access_log /var/log/nginx/access.log upstream_debug;

    location = /api/render-html {
        proxy_pass  http://urlToHtml_replicas;
        proxy_http_version  1.1;
        proxy_set_header    Connection          "";
        # The upstream peer list is only as fresh as the last reload (see
        # urlToHtml_replicas above) — a stale entry for an already-recycled replica
        # should fail fast into a proxy_next_upstream retry, not eat into the
        # 45s/3-retry budget below.
        proxy_connect_timeout 2s;
        proxy_cache         cache;
		proxy_cache_valid   200 7d;
		proxy_cache_valid   400 404 500 502 503 1m;
		proxy_cache_lock        on;
		proxy_cache_lock_timeout 120s;
		proxy_cache_lock_age     120s;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
		proxy_set_header    X-Proxy-Cache       $upstream_cache_status;

		# A replica returns 503 when its own render queue is backed up (see
		# MAX_QUEUE_WAIT_MS in renderer.js) instead of making the client wait it out.
		# Retrying re-enters least_conn peer selection (excluding the failed peer),
		# so it lands on whichever replica currently has the fewest active
		# connections instead of a blind reconnect.
		proxy_next_upstream         error timeout http_503;
		proxy_next_upstream_tries   3;
    }

    location / {
        return 404;
    }
}