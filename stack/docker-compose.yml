
version: '3'

services:

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      # - nginx-data:/usr/share/nginx/html
      # - /home/ubuntu/stack/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/nginx:/etc/nginx/conf.d
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - nginx-cache:/var/cache/nginx
    networks:
      - proxy
      - prerender
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "50"
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
    # Reloads periodically so app.conf's urlToHtml_replicas upstream re-resolves
    # tasks.urlToHtml and picks up replicas Swarm has replaced/restarted/scaled
    # since the last reload (nginx only resolves a hostname `server` line at
    # load/reload, not continuously) — this loop already existed for cert renewal
    # (was every 6h), just shortened. `nginx -t &&` keeps a transient DNS hiccup at
    # reload time from silently leaving the peer list stale with no signal — a
    # failed test/reload lands in this container's stdout, which the json-file
    # logging driver below captures.
    command: "/bin/sh -c 'while :; do sleep 90s & wait $${!}; nginx -t && nginx -s reload || echo \"nginx reload failed at $$(date)\"; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "50"
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
 
networks:
  prerender:
    external: true
  proxy:
    external: true

volumes:
  nginx-cache: